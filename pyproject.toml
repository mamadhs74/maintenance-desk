[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintdesk"
version = "0.1.0"
description = "Maintenance ticket desk for machines: one service, two data stores (SQLite and Redis), a JSON API and a Python desktop client."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "redis>=5.0",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["maintdesk"]
